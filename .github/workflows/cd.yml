name: CD - Frontend (Build, ECR e Deploy)

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: sgpj-frontend

jobs:
  build-and-push:
    name: Build Vite + Imagem Docker + Push ECR
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.build-push.outputs.image }}

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producao (Vite)
        run: npm run build

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e Push da imagem Docker para o ECR
        id: build-push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/${{ env.ECR_REPOSITORY }}:latest"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "Imagem do Frontend enviada com sucesso para o ECR: $IMAGE_URI"

  deploy:
    name: Deploy nas EC2s de App via SSM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Descobrir instancias de App e atualizar container Frontend via SSM
        run: |
          echo "Buscando instancias ativas de app (Frontend)..."
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ec2-app-a,ec2-app-b" "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text 2>/dev/null || echo "")

          if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" = "None" ]; then
            echo "Nenhuma EC2 de app ativa encontrada no momento (ambiente desligado/destroy)."
            echo "A nova imagem ja foi publicada no Amazon ECR com sucesso! Quando a infraestrutura for recriada, ela subira com essa versao."
            exit 0
          fi

          echo "Instancias encontradas: $INSTANCE_IDS"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_IDS \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 487375662162.dkr.ecr.us-east-1.amazonaws.com && docker pull 487375662162.dkr.ecr.us-east-1.amazonaws.com/sgpj-frontend:latest && docker restart nginx 2>/dev/null || true"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Aguardando execucao nas instancias..."
          sleep 20

          FAILED=0
          for ID in $INSTANCE_IDS; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Status $ID: $STATUS"
            if [ "$STATUS" != "Success" ]; then
              FAILED=1
            fi
          done

          if [ $FAILED -ne 0 ]; then
            echo "Deploy do Frontend falhou em uma ou mais instancias!"
            exit 1
          fi

          echo "Deploy do Frontend realizado com sucesso em todas as instancias de App!"