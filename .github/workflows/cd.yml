name: CD - Frontend (Build, ECR e Deploy)

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: sgpj-frontend

jobs:
  build-and-deploy:
    name: Build React + Push ECR + Deploy no EFS via SSM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do cÃ³digo
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependÃªncias
        run: npm ci

      - name: Build de produÃ§Ã£o (Vite)
        run: npm run build

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e Push da imagem Docker para o Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/${{ env.ECR_REPOSITORY }}:latest"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "âœ… Imagem do Frontend enviada para o ECR: $IMAGE_URI"

      - name: Obter bucket bronze e instÃ¢ncia app-a dinamicamente
        id: discovery
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ec2-app-a" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text 2>/dev/null || echo "")

          BUCKET_NAME=$(aws s3api list-buckets --query "Buckets[?starts_with(Name, 'sgpj-bronze-')].Name | [0]" --output text 2>/dev/null || echo "")

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT

      - name: Upload da pasta dist/ para o S3 e deploy no EFS via SSM
        run: |
          INSTANCE_ID="${{ steps.discovery.outputs.instance_id }}"
          BUCKET_NAME="${{ steps.discovery.outputs.bucket_name }}"

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ] || [ -z "$BUCKET_NAME" ] || [ "$BUCKET_NAME" = "None" ]; then
            echo "âš ï¸ Nenhuma EC2 de frontend ou bucket ativos encontrados no momento (ambiente desligado/destroy)."
            echo "âœ… Imagem Docker jÃ¡ estÃ¡ salva no Amazon ECR com sucesso! Quando a infraestrutura for recriada, ela subirÃ¡ com a versÃ£o atualizada."
            exit 0
          fi

          aws s3 sync dist/ s3://$BUCKET_NAME/frontend-deploy/dist/ --delete

          COMMAND_ID=$(aws ssm send-command \
            --instance-id "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"aws s3 sync s3://$BUCKET_NAME/frontend-deploy/dist/ /mnt/efs-sgpj/volumes/nginx/html/ --delete && echo Deploy OK\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          sleep 20

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" --output text 2>/dev/null || echo "Pending")

          echo "Status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "âŒ Deploy do Frontend falhou!"
            exit 1
          fi

          echo "âœ… Frontend atualizado com sucesso no EFS!"

