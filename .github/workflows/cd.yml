name: CD - Frontend (Build, ECR e Deploy)

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: sgpj-frontend

jobs:
  build-and-push:
    name: Build Vite + Imagem Docker + Push ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producao (Vite)
        run: npm run build

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e Push da imagem Docker para o ECR
        id: build-push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/${{ env.ECR_REPOSITORY }}:latest"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "Imagem do Frontend enviada para o ECR: $IMAGE_URI"

      - name: Obter bucket bronze e instancia app-a dinamicamente
        id: get-infra
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="sgpj-bronze-${ACCOUNT_ID}"
          echo "bucket=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "Bucket S3 para sync: $BUCKET_NAME"

          APP_A_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ec2-app-a" "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text 2>/dev/null || echo "")
          echo "app_a_id=$APP_A_ID" >> $GITHUB_OUTPUT
          echo "Instancia ec2-app-a: $APP_A_ID"

      - name: Upload do build (dist/) para o S3
        run: |
          aws s3 sync dist/ s3://${{ steps.get-infra.outputs.bucket }}/frontend/ --delete

      - name: Sincronizar build do S3 para o EFS compartilhado via SSM
        if: ${{ steps.get-infra.outputs.app_a_id != '' && steps.get-infra.outputs.app_a_id != 'None' }}
        run: |
          echo "Disparando sincronizacao do build no EFS via ec2-app-a..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.get-infra.outputs.app_a_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["aws s3 sync s3://${{ steps.get-infra.outputs.bucket }}/frontend/ /mnt/efs-sgpj/volumes/nginx/html/ --delete && docker exec nginx nginx -s reload 2>/dev/null || true"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          sleep 15

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.get-infra.outputs.app_a_id }}" \
            --query "Status" --output text 2>/dev/null || echo "Pending")

          echo "Status da sincronizacao: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "Aviso: Sincronizacao SSM retornou status $STATUS. Os arquivos continuam seguros no S3."
          else
            echo "Frontend sincronizado com sucesso no EFS compartilhado!"
          fi