name: CI - Frontend (Build)

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Instalar dependências e validar build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Validar build de producao
        run: npm run build
