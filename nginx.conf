server {
    listen 80 default_server;

    # Redirecionamento de /api para o backend específico
    location /api/ {
        proxy_pass http://api.backend:8080/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenTelemetry — proxy de traces do browser para o Alloy local (porta 4318 HTTP)
    # O browser envia para /v1/traces (caminho relativo, sem precisar de IP externo)
    # O Nginx repassa para o Alloy que está rodando na mesma EC2 (ec2-app-a/b)
    # O Alloy encaminha via gRPC 4317 para o Tempo na ec2-observability
    location /v1/traces {
        proxy_pass http://localhost:4318/v1/traces;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Type $content_type;

        # CORS — necessário pois o browser envia cross-origin (fetch da app React)
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, traceparent, tracestate' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, traceparent, tracestate';
            add_header 'Content-Length' '0';
            return 204;
        }
    }

    # Tratamento para o frontend React (Single Page Application)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
